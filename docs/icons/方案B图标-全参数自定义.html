<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>方案B 图标 - 全参数自定义</title>
<style>
  body { font-family: sans-serif; background: #2b2b2b; color: #eee; margin: 20px; }
  .wrap { display: flex; gap: 30px; align-items: flex-start; flex-wrap: wrap; }
  .stage { position: relative; width: 420px; height: 420px; border-radius: 8px;
    background-image: linear-gradient(45deg,#3a3a3a 25%,transparent 25%),linear-gradient(-45deg,#3a3a3a 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#3a3a3a 75%),linear-gradient(-45deg,transparent 75%,#3a3a3a 75%);
    background-size: 20px 20px; background-position: 0 0,0 10px,10px -10px,-10px 0; background-color:#2b2b2b; }
  #svgwrap { position: absolute; inset: 30px; }
  .controls { line-height: 2.3; min-width: 420px; max-height: 640px; overflow-y: auto; }
  .controls label { display: inline-block; width: 135px; }
  .controls input[type=range] { width: 200px; vertical-align: middle; }
  .controls select, .controls input[type=color] { background: #333; color: #eee; border: 1px solid #555; }
  .btn { margin: 6px 4px 0 0; padding: 6px 14px; background: #b5281f; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
  #info { margin-top: 12px; color: #ffd; font-size: 13px; background:#333; padding:8px; border-radius:6px; word-break:break-all; }
  .group { border-top: 1px solid #444; margin-top: 10px; padding-top: 8px; }
  .group h3 { margin: 4px 0; font-size: 13px; color: #aaa; }
  .hint { color: #999; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <div id="svgwrap">
      <svg id="icon" width="100%" height="100%" viewBox="0 0 64 64">
        <g id="papergroup">
          <path id="paper" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                fill="#efe9dc" stroke="#b5281f" stroke-width="0.6" stroke-linejoin="round" transform="translate(2 1) scale(2.8)" />
          <path id="fold" d="M14 2v6h6" fill="#f6d8d8" stroke="#b5281f" stroke-width="0.6" stroke-linejoin="round" transform="translate(2 1) scale(2.8)" />
        </g>
        <text id="p" x="29.25" y="55.75" font-family="Impact, 'Arial Black', sans-serif" font-size="66.7" font-weight="700" fill="#b5281f" text-anchor="middle">P</text>
      </svg>
    </div>
  </div>
  <div class="controls">
    <div class="group">
      <h3>P 位置与大小（可鼠标拖动 P）</h3>
      <div><label>字号：</label><input type="range" id="size" min="20" max="90" step="0.5" value="66.7"></div>
      <div><label>X 位置：</label><input type="range" id="xpos" min="10" max="54" step="0.25" value="29.25"></div>
      <div><label>Y 位置：</label><input type="range" id="ypos" min="40" max="62" step="0.25" value="55.75"></div>
    </div>
    <div class="group">
      <h3>P 字体</h3>
      <div><label>字体：</label>
        <select id="font">
          <option value="Impact, 'Arial Black', sans-serif" selected>Impact（窄粗）</option>
          <option value="'Arial Black', Impact, sans-serif">Arial Black</option>
          <option value="Arial, sans-serif">Arial</option>
          <option value="'Segoe UI', Arial, sans-serif">Segoe UI</option>
          <option value="Verdana, sans-serif">Verdana</option>
          <option value="Georgia, serif">Georgia（衬线）</option>
          <option value="'Times New Roman', serif">Times New Roman（衬线）</option>
          <option value="Consolas, monospace">Consolas（等宽）</option>
        </select>
      </div>
      <div><label>字重：</label>
        <select id="weight">
          <option value="700" selected>粗体</option>
          <option value="400">常规</option>
          <option value="900">特粗</option>
        </select>
      </div>
      <div><label>P 颜色：</label><input type="color" id="pcolor" value="#b5281f"></div>
    </div>
    <div class="group">
      <h3>纸面（软盘内部）</h3>
      <div><label>纸面颜色：</label><input type="color" id="papercolor" value="#efe9dc"><span class="hint">（默认米色=方案A）</span></div>
      <div><label>描边颜色：</label><input type="color" id="strokecolor" value="#b5281f"></div>
      <div><label>描边粗细：</label><input type="range" id="strokew" min="0.2" max="2" step="0.1" value="0.6"></div>
      <div><label>折角颜色：</label><input type="color" id="foldcolor" value="#f6d8d8"></div>
      <div><label>折角显示：</label><input type="checkbox" id="showfold" checked></div>
      <div><label>纸面圆角：</label><input type="range" id="paperradius" min="0" max="6" step="0.5" value="2"></div>
    </div>
    <div>
      <button class="btn" id="showbtn">显示当前参数</button>
      <button class="btn" id="exportbtn" style="background:#1d9e75">导出 PNG（保存图片）</button>
      <button class="btn" id="savebtn" style="background:#185fa5">保存参数</button>
      <button class="btn" id="resetbtn" style="background:#555">重置</button>
    </div>
    <div id="info">背景透明；纸面默认米色。调好后点「导出 PNG」保存图片发我</div>
  </div>
</div>

<script>
  const p = document.getElementById('p');
  const paper = document.getElementById('paper');
  const fold = document.getElementById('fold');
  const svg = document.getElementById('icon');
  const info = document.getElementById('info');
  const $ = id => document.getElementById(id);

  const els = {
    size: $('size'), xpos: $('xpos'), ypos: $('ypos'),
    font: $('font'), weight: $('weight'), pcolor: $('pcolor'),
    papercolor: $('papercolor'), strokecolor: $('strokecolor'),
    strokew: $('strokew'), foldcolor: $('foldcolor'), showfold: $('showfold'),
    paperradius: $('paperradius')
  };

  const defaults = {
    size: '66.7', xpos: '29.25', ypos: '55.75',
    font: "Impact, 'Arial Black', sans-serif", weight: '700', pcolor: '#b5281f',
    papercolor: '#efe9dc', strokecolor: '#b5281f',
    strokew: '0.6', foldcolor: '#f6d8d8', showfold: true, paperradius: '2'
  };

  function apply() {
    p.setAttribute('font-size', els.size.value);
    p.setAttribute('x', els.xpos.value);
    p.setAttribute('y', els.ypos.value);
    p.setAttribute('font-family', els.font.value);
    p.setAttribute('font-weight', els.weight.value);
    p.setAttribute('fill', els.pcolor.value);
    paper.setAttribute('fill', els.papercolor.value);
    paper.setAttribute('stroke', els.strokecolor.value);
    paper.setAttribute('stroke-width', els.strokew.value);
    fold.setAttribute('fill', els.foldcolor.value);
    fold.setAttribute('stroke', els.strokecolor.value);
    fold.setAttribute('stroke-width', els.strokew.value);
    fold.style.display = els.showfold.checked ? '' : 'none';
    // 纸面圆角：调整 path 里的圆弧半径
    const r = parseFloat(els.paperradius.value);
    paper.setAttribute('d',
      `M14 2H6a${r} ${r} 0 0 0-${r} ${r}v${16-r}a${r} ${r} 0 0 0 ${r} ${r}h12a${r} ${r} 0 0 0 ${r}-${r}V8z`);
  }

  function svgPoint(e) {
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }

  Object.values(els).forEach(el => {
    if (el.type === 'checkbox') el.addEventListener('change', apply);
    else el.addEventListener('input', apply);
  });

  let dragging = false;
  p.addEventListener('mousedown', e => { dragging = true; e.preventDefault(); });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const pt = svgPoint(e);
    els.xpos.value = pt.x.toFixed(2);
    els.ypos.value = pt.y.toFixed(2);
    apply();
  });
  window.addEventListener('mouseup', () => { dragging = false; });

  $('showbtn').addEventListener('click', () => {
    info.textContent =
      '字号=' + els.size.value + ' 位置x=' + els.xpos.value + ' y=' + els.ypos.value +
      ' | 字体=' + els.font.options[els.font.selectedIndex].text + ' 字重=' + els.weight.value + ' P色=' + els.pcolor.value +
      ' | 纸面=' + els.papercolor.value + ' 描边=' + els.strokecolor.value + '/' + els.strokew.value +
      ' 折角=' + els.foldcolor.value + ' 折角显示=' + (els.showfold.checked?'是':'否') +
      ' 纸面圆角=' + els.paperradius.value;
  });

  $('resetbtn').addEventListener('click', () => {
    for (const k in defaults) {
      const el = els[k];
      if (el.type === 'checkbox') el.checked = defaults[k];
      else el.value = defaults[k];
    }
    apply();
    info.textContent = '已重置';
  });

  // 导出 PNG：把当前 SVG 渲染成 1024 高清 PNG 下载
  $('exportbtn').addEventListener('click', () => {
    // 深拷贝当前 SVG，放大到 1024
    const clone = svg.cloneNode(true);
    clone.setAttribute('width', '1024');
    clone.setAttribute('height', '1024');
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    const svgStr = new XMLSerializer().serializeToString(clone);
    const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);

    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, 1024, 1024);
      URL.revokeObjectURL(url);
      // 触发下载
      const a = document.createElement('a');
      a.download = 'pdf图标.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
      info.textContent = '已导出 pdf图标.png（透明背景，1024px）';
    };
    img.src = url;
  });

  // 保存参数到 localStorage，刷新后自动恢复
  function collectParams() {
    const obj = {};
    for (const k in els) {
      const el = els[k];
      obj[k] = (el.type === 'checkbox') ? el.checked : el.value;
    }
    return obj;
  }
  $('savebtn').addEventListener('click', () => {
    localStorage.setItem('pdfIconParams', JSON.stringify(collectParams()));
    info.textContent = '参数已保存，刷新页面会自动恢复';
  });
  // 页面加载时恢复
  try {
    const saved = JSON.parse(localStorage.getItem('pdfIconParams'));
    if (saved) {
      for (const k in saved) {
        const el = els[k];
        if (!el) continue;
        if (el.type === 'checkbox') el.checked = saved[k];
        else el.value = saved[k];
      }
    }
  } catch (e) {}

  apply();
</script>
</body>
</html>
